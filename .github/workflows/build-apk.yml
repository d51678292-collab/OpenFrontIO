name: Build OpenFront APK (Online & Offline)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Upgrade npm to 12.1.0
        run: npm install --global --ignore-scripts npm@12.1.0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (use runner preinstalled SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: Install OpenFront dependencies
        env:
          HUSKY: 0
        run: npm run inst

      - name: Build web app into static/
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build-prod

      - name: Verify static/ output, deduplicate assets, and render offline.html
        run: |
          test -f static/index.html
          mkdir -p mobile/www
          cp -r static/* mobile/www/
          mv mobile/www/index.html mobile/www/offline.html.ejs

          npx tsx << 'NODE_EOF'
          import fs from "fs";
          import path from "path";
          import ejs from "ejs";

          // Merge unhashed resources/ (maps, icons, images, sprites, sounds, etc.)
          for (const baseDir of ["resources", "proprietary"]) {
            if (!fs.existsSync(baseDir)) continue;
            for (const entry of fs.readdirSync(baseDir)) {
              if (entry === "public") continue;
              const src = path.join(baseDir, entry);
              const dst = path.join("mobile/www", entry);
              if (fs.statSync(src).isDirectory()) {
                fs.cpSync(src, dst, { recursive: true, force: false });
                console.log(`Merged ${src} -> ${dst}`);
              }
            }
          }

          if (!fs.existsSync("mobile/www/maps/tutorial/map.bin")) {
            throw new Error("Fatal: mobile/www/maps/tutorial/map.bin is missing!");
          }

          // Remove duplicate hashed _assets/ so maps/images aren't stored twice in the APK
          if (fs.existsSync("mobile/www/_assets")) {
            const bundleFiles = fs.existsSync("mobile/www/assets")
              ? fs.readdirSync("mobile/www/assets").filter((f) => f.endsWith(".js") || f.endsWith(".css"))
              : [];
            const hasHardcodedUnderscoreAssets = bundleFiles.some((f) =>
              fs.readFileSync(path.join("mobile/www/assets", f), "utf8").includes("_assets/")
            );
            if (!hasHardcodedUnderscoreAssets) {
              fs.rmSync("mobile/www/_assets", { recursive: true, force: true });
              console.log("Removed duplicate mobile/www/_assets/ to cut APK size.");
            } else if (fs.existsSync("mobile/www/_assets/maps")) {
              fs.rmSync("mobile/www/_assets/maps", { recursive: true, force: true });
              console.log("Removed duplicate mobile/www/_assets/maps/ to cut APK size.");
            }
          }

          // Render offline.html.ejs using direct unhashed paths (assetManifest: "{}")
          let tpl = fs.readFileSync("mobile/www/offline.html.ejs", "utf8");
          tpl = tpl.replace(/(href|src|content)=(["'])<%[=\-_]?[^%]*%>/gi, "$1=$2");

          const data: Record<string, string> = {
            cdnBase: JSON.stringify("https://localhost"),
            gameEnv: JSON.stringify("prod"),
            gitCommit: JSON.stringify(process.env.GITHUB_SHA || "offline"),
            turnstileSiteKey: JSON.stringify("1x00000000000000000000AA"),
            jwtAudience: JSON.stringify("localhost"),
            faroCollectorUrl: JSON.stringify(""),
            cluster: "null",
            instanceLetter: JSON.stringify("a"),
            numWorkers: "1",
            serverHost: JSON.stringify(""),
            siteHost: JSON.stringify(""),
            instanceId: JSON.stringify(""),
            adsEnabled: "false",
            assetManifest: "{}"
          };

          let rendered = "";
          for (let attempt = 0; attempt < 15; attempt++) {
            try {
              rendered = ejs.render(tpl, data);
              break;
            } catch (err) {
              const match = /([A-Za-z0-9_$]+) is not defined/.exec((err as Error).message || "");
              if (!match) throw err;
              console.log("Filling missing EJS template var:", match[1]);
              data[match[1]] = JSON.stringify("");
            }
          }

          if (!rendered) {
            throw new Error("Failed to render offline.html.ejs");
          }

          rendered = rendered.replace(/<%[\s\S]*?%>/g, "");
          rendered = rendered.replace(/<script[^>]+challenges\.cloudflare\.com[^>]*><\/script>/gi, "");
          rendered = rendered.replace(/<script[^>]+googletagmanager\.com[^>]*><\/script>/gi, "");

          // Ensure viewport-fit=cover is enabled so WebView fills the entire screen with no notch border
          rendered = rendered.replace(
            /(<meta[^>]*name=["']viewport["'][^>]*content=["'][^"']*)(["'])/i,
            (full, prefix, quote) =>
              /viewport-fit=/i.test(full) ? full : `${prefix}, viewport-fit=cover${quote}`
          );

          fs.writeFileSync("mobile/www/offline.html", rendered);
          fs.unlinkSync("mobile/www/offline.html.ejs");
          console.log("Rendered mobile/www/offline.html successfully.");
          NODE_EOF

      - name: Create Dual-Mode Launcher (mobile/www/index.html)
        run: |
          cat << 'EOF' > mobile/www/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
            <title>OpenFront Mobile</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(circle at top, #1e293b, #0b1120 70%);
                color: #f8fafc;
                font-family: system-ui, -apple-system, sans-serif;
                padding: 24px;
              }
              .card {
                width: 100%;
                max-width: 420px;
                background: rgba(15, 23, 42, 0.9);
                border: 1px solid rgba(148, 163, 184, 0.2);
                border-radius: 20px;
                padding: 28px 24px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
                text-align: center;
              }
              h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 6px; }
              .subtitle { color: #94a3b8; font-size: 0.92rem; margin-bottom: 18px; }
              .status {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 6px 14px;
                border-radius: 999px;
                font-size: 0.85rem;
                font-weight: 600;
                margin-bottom: 24px;
                background: rgba(30, 41, 59, 0.9);
                border: 1px solid rgba(148, 163, 184, 0.25);
              }
              .dot { width: 9px; height: 9px; border-radius: 50%; }
              .dot.online { background: #22c55e; }
              .dot.offline { background: #f59e0b; }
              .btn {
                width: 100%;
                border: none;
                border-radius: 14px;
                padding: 16px 18px;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                margin-bottom: 14px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                transition: transform 0.1s ease, opacity 0.15s ease;
              }
              .btn:active { transform: scale(0.98); }
              .btn-offline {
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                color: #ffffff;
              }
              .btn-online {
                background: linear-gradient(135deg, #059669, #047857);
                color: #ffffff;
              }
              .btn small { font-weight: 400; font-size: 0.8rem; opacity: 0.9; }
              .hint { color: #64748b; font-size: 0.78rem; margin-top: 8px; line-height: 1.4; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>OpenFront.io</h1>
              <p class="subtitle">Choose how you want to play</p>

              <div class="status" id="netStatus">
                <span class="dot offline" id="netDot"></span>
                <span id="netText">Checking connection...</span>
              </div>

              <button class="btn btn-offline" onclick="location.href='/offline.html'">
                <span>Play Offline</span>
                <small>Singleplayer vs AI &bull; Works with no internet</small>
              </button>

              <button class="btn btn-online" onclick="goOnline()">
                <span>Play Online</span>
                <small>Official openfront.io multiplayer &amp; accounts</small>
              </button>

              <p class="hint">&copy; OpenFront and Contributors</p>
            </div>

            <script>
              function updateStatus() {
                const online = navigator.onLine;
                document.getElementById("netDot").className = "dot " + (online ? "online" : "offline");
                document.getElementById("netText").textContent = online
                  ? "Internet Connected"
                  : "Offline Mode Available";
              }
              function goOnline() {
                if (!navigator.onLine && !confirm("No internet connection detected. Try opening openfront.io anyway?")) {
                  return;
                }
                window.location.href = "https://openfront.io";
              }
              window.addEventListener("online", updateStatus);
              window.addEventListener("offline", updateStatus);
              updateStatus();
            </script>
          </body>
          </html>
          EOF

      - name: Initialize isolated Capacitor 7 Android project
        run: |
          cd mobile
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.openfront.mobile",
            "appName": "OpenFront",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "allowNavigation": [
                "openfront.io",
                "*.openfront.io",
                "api.openfront.io",
                "challenges.cloudflare.com",
                "*.cloudflare.com",
                "discord.com",
                "*.discord.com"
              ]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Configure AndroidManifest and Edge-to-Edge Fullscreen (no notch border)
        run: |
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i '0,/<application/{s/<application/<application android:usesCleartextTraffic="true"/}' "$MANIFEST"
          fi

          MAIN_ACT=$(find mobile/android/app/src/main/java -name "MainActivity.java" | head -n 1)
          PKG_LINE=$(grep -m 1 '^package ' "$MAIN_ACT")

          cat << EOF > "$MAIN_ACT"
          $PKG_LINE

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyEdgeToEdgeFullscreen();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      applyEdgeToEdgeFullscreen();
                  }
              }

              private void applyEdgeToEdgeFullscreen() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      getWindow().setAttributes(lp);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }

                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  }

                  View content = findViewById(android.R.id.content);
                  if (content != null) {
                      ViewCompat.setOnApplyWindowInsetsListener(content, (v, windowInsets) -> {
                          Insets ime = windowInsets.getInsets(WindowInsetsCompat.Type.ime());
                          v.setPadding(0, 0, 0, ime.bottom);
                          return windowInsets;
                      });
                      ViewCompat.requestApplyInsets(content);
                  }
              }
          }
          EOF

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "Asset folder breakdown:"
          du -sh ../../mobile/www/* | sort -hr | awk 'NR<=10' || true
          echo "Final APK size:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -qql app/build/outputs/apk/debug/app-debug.apk "assets/public/maps/tutorial/map.bin" | grep -q "map.bin"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Online-Offline-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
