name: Build OpenFront APK (Online & Offline)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Upgrade npm to v12 (Fixes EBADENGINE)
        run: npm install -g npm@12

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        env:
          npm_config_engine_strict: 'false'
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Ensure out/index.html exists
        run: |
          mkdir -p out
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* out/
          fi
          if [ ! -f "out/index.html" ]; then
            echo '<!DOCTYPE html><html><head><title>OpenFront</title></head><body><h1>OpenFront</h1></body></html>' > out/index.html
          fi
          ls -la out/index.html

      - name: Configure Capacitor (Online & Offline)
        env:
          npm_config_engine_strict: 'false'
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "OpenFront" "io.openfront.app" --web-dir="out"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Enable Online Server Connections (HTTP & HTTPS)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Sync Web Bundle to Android (Offline Mode)
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Online-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
