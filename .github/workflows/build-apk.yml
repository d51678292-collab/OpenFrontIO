name: Build OpenFront Online & Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install OpenFront Dependencies
        run: npm run inst

      - name: Build Web Client & Local Single-Player Engine
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Configure Capacitor for Online + Offline Hybrid Mode
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.openfront.app",
            "appName": "OpenFront",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["openfront.io", "*.openfront.io"]
            }
          }
          EOF
          npx cap add android

      - name: Enable Network & WebSocket Permissions in Android
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Bundle into Android Project
        run: npx cap sync android

      - name: Compile Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Hybrid APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Online-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
