name: Build OpenFront APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix engine constraints in package.json
        run: |
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (pkg.engines && pkg.engines.npm) {
            delete pkg.engines.npm;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          }
          '

      - name: Install dependencies
        run: npm install --force

      - name: Build web app
        run: npm run build

      - name: Ensure out folder exists
        run: |
          if [ -d "dist" ] && [ ! -d "out" ]; then
            cp -r dist out
          elif [ ! -d "out" ] && [ ! -d "dist" ]; then
            mkdir -p out
            echo "<html><body><h1>OpenFront</h1></body></html>" > out/index.html
          fi

      - name: Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "OpenFront" "io.openfront.app" --web-dir="out"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web files to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
