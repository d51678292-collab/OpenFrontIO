name: Build OpenFront APK (Online & Offline)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Auto-fix formatting (Fixes oxfmt error)
        run: npx oxfmt --write .github/workflows/build-apk.yml || true

      - name: Build web app (Fixes missing out/index.html)
        run: npm run build

      - name: Verify build output folder
        run: |
          if [ -d "dist" ] && [ ! -d "out" ]; then
            cp -r dist out
          fi
          ls -la out/index.html

      - name: Configure Capacitor for Online & Offline mode
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "OpenFront" "io.openfront.app" --web-dir="out"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Allow Online Server Connections (Cleartext & Mixed Content)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Sync web files to Android for Offline play
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Online-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
